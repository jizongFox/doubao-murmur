[build-system]
requires = ["setuptools>=77.0", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "doubao-murmur"
version = "1.5.1"
description = "Voice-to-text input using Doubao ASR for SteamOS/Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "lilong7676" },
]

dependencies = [
    "PyGObject>=3.42",
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "python-xlib>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
doubao-murmur = "doubao_murmur.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doubao_murmur.resources" = ["*.js", "*.css", "*.svg"]
