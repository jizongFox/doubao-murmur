name: Ubuntu 22.04 X11 compatibility

on:
  push:
    paths: ['linux/**', '.github/workflows/ubuntu-x11.yml']
  pull_request:
    paths: ['linux/**', '.github/workflows/ubuntu-x11.yml']

permissions:
  contents: read

jobs:
  jammy-x11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install official GTK4 and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-webkit-6.0 libportaudio2 xdotool xclip x11-utils xvfb
      - name: Install using system GI bindings
        working-directory: linux
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Unit tests
        working-directory: linux
        run: .venv/bin/python -m pytest tests/ -q
      - name: GTK4, WebKit and XRecord smoke test
        working-directory: linux
        # No remote pages are loaded. Restricted CI/container namespaces may
        # prevent WebKit's sandbox; this exception is only for the smoke test.
        run: xvfb-run -a env GDK_BACKEND=x11 XDG_SESSION_TYPE=x11 DOUBAO_X11_SMOKE=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 .venv/bin/python -m pytest tests/test_x11_smoke.py -q
